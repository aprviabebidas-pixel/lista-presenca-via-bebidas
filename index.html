<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Lista de Presença | Via Bebidas</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f3f5f8;
      color: #202938;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 540px;
      margin: 28px auto;
      padding: 24px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 5px 24px #00000012;
    }

    h1 {
      margin: 0 0 8px;
      color: #1769aa;
      font-size: 27px;
    }

    .subtitulo {
      color: #637083;
      margin: 0 0 14px;
      line-height: 1.5;
    }

    .treinamento-info {
      margin-bottom: 24px;
      padding: 13px 15px;
      background: #eaf3fc;
      border-left: 4px solid #1769aa;
      border-radius: 8px;
    }

    .treinamento-info strong {
      display: block;
      margin-bottom: 5px;
      color: #1769aa;
      font-size: 13px;
    }

    .treinamento-info span {
      display: block;
      font-size: 15px;
      font-weight: bold;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 16px 0 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd2dc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 14px 18px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-assinar {
      width: 100%;
      margin-top: 12px;
      color: #1769aa;
      background: #e7f1fb;
      border: 2px solid #1769aa;
    }

    .btn-enviar {
      width: 100%;
      margin-top: 22px;
      color: #fff;
      background: #1769aa;
    }

    .assinatura-preview {
      width: 100%;
      height: 125px;
      margin-top: 8px;
      border: 2px dashed #b6c2d0;
      border-radius: 9px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .assinatura-preview img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }

    .assinatura-preview span {
      color: #8390a0;
      font-size: 14px;
    }

    #mensagem {
      margin-top: 18px;
      font-weight: bold;
      line-height: 1.5;
    }

    .erro {
      color: #b42318;
    }

    .sucesso {
      color: #16723b;
    }

    /* Modal de assinatura */

    .modal-assinatura {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #fff;
    }

    .modal-assinatura.aberto {
      display: block;
    }

    /*
      A área interna é sempre desenhada na horizontal.

      Em celulares na vertical, giramos a interface
      inteira em 90 graus, sem depender da configuração
      de rotação automática do aparelho.
    */

    .assinatura-interface {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      background: #fff;
    }

    .modal-topo {
      padding: 10px 16px;
      background: #1769aa;
      color: #fff;
      text-align: center;
      flex-shrink: 0;
    }

    .modal-topo h2 {
      margin: 0;
      font-size: 19px;
    }

    .modal-topo p {
      margin: 5px 0 0;
      font-size: 13px;
    }

    .area-desenho {
      flex: 1;
      min-height: 0;
      padding: 8px;
      background: #f5f7fa;
      display: flex;
    }

    .quadro-assinatura {
      position: relative;
      flex: 1;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: #fff;
      border: 2px dashed #a6b4c4;
      border-radius: 10px;
    }

    #canvasAssinatura {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      z-index: 2;
    }

    .guia-assinatura {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .guia-texto {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      color: #8492a4;
      font-size: 13px;
      text-align: center;
      user-select: none;
    }

    .guia-linha {
      position: absolute;
      top: 68%;
      left: 5%;
      width: 90%;
      border-bottom: 1px solid #c2cad5;
    }

    .guia-direcao {
      position: absolute;
      bottom: 10px;
      left: 0;
      right: 0;
      color: #8492a4;
      font-size: 12px;
      text-align: center;
      user-select: none;
    }

    .modal-botoes {
      display: flex;
      gap: 10px;
      padding: 10px 16px;
      padding-bottom: max(
        10px,
        env(safe-area-inset-bottom)
      );
      background: #fff;
      border-top: 1px solid #e4e9ef;
      flex-shrink: 0;
    }

    .modal-botoes button {
      flex: 1;
      padding: 12px 8px;
      font-size: 14px;
    }

    .btn-cancelar {
      background: #e9edf2;
      color: #263445;
    }

    .btn-limpar {
      background: #ffe8e6;
      color: #a32b21;
    }

    .btn-confirmar {
      background: #1769aa;
      color: #fff;
    }

    body.modal-aberto {
      overflow: hidden;
    }

    /*
      Rotação visual para celulares em pé.

      A largura da interface passa a ser a altura
      disponível da tela, e vice-versa.

      O canvas permanece horizontal em suas próprias
      coordenadas. Assim, a imagem exportada não gira.
    */

    @media (orientation: portrait) and (pointer: coarse) {
      .assinatura-interface {
        inset: auto;
        top: 0;
        left: 100%;
        width: 100dvh;
        height: 100vw;
        transform-origin: top left;
        transform: rotate(90deg);
      }

      .modal-topo {
        padding: 5px 12px;
      }

      .modal-topo h2 {
        font-size: 15px;
      }

      .modal-topo p {
        margin-top: 2px;
        font-size: 11px;
      }

      .modal-botoes {
        padding: 6px 10px;
        padding-right: max(
          10px,
          env(safe-area-inset-bottom)
        );
        gap: 6px;
      }

      .modal-botoes button {
        padding: 9px 5px;
        font-size: 12px;
      }

      .guia-texto {
        top: 6px;
        font-size: 11px;
      }

      .guia-direcao {
        bottom: 5px;
        font-size: 10px;
      }
    }

    @media (max-width: 600px) {
      .container {
        margin: 12px;
        padding: 18px;
      }
    }

    @media (orientation: landscape) and (max-height: 500px) {
      .modal-topo {
        padding: 5px 12px;
      }

      .modal-topo h2 {
        font-size: 15px;
      }

      .modal-topo p {
        margin-top: 2px;
        font-size: 11px;
      }

      .modal-botoes {
        padding: 6px 10px;
      }

      .modal-botoes button {
        padding: 9px 5px;
        font-size: 12px;
      }

      .guia-texto {
        top: 6px;
        font-size: 11px;
      }

      .guia-direcao {
        bottom: 5px;
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

  <main class="container">
    <h1>Via Bebidas</h1>

    <p class="subtitulo">
      Lista de presença digital de treinamentos
    </p>

    <div
      class="treinamento-info"
      aria-live="polite"
    >
      <strong>Treinamento</strong>

      <span id="nomeTreinamento">
        Carregando treinamento...
      </span>
    </div>

    <form id="formulario">

      <label for="nome">Nome completo</label>

      <input
        id="nome"
        maxlength="150"
        autocomplete="name"
        required
      >

      <label for="matricula">Matrícula</label>

      <input
        id="matricula"
        maxlength="30"
        required
      >

      <label for="funcao">Função</label>

      <input
        id="funcao"
        maxlength="100"
      >

      <label for="setor">Setor</label>

      <input
        id="setor"
        maxlength="100"
        required
      >

      <label>Assinatura do funcionário</label>

      <div class="assinatura-preview">
        <span id="textoPreview">
          Nenhuma assinatura registrada
        </span>

        <img
          id="imagemPreview"
          alt="Prévia da assinatura"
        >
      </div>

      <button
        type="button"
        class="btn-assinar"
        id="abrirAssinatura"
      >
        Assinar em tela cheia
      </button>

      <button
        type="submit"
        class="btn-enviar"
        id="enviar"
        disabled
      >
        Registrar presença
      </button>

      <p
        id="mensagem"
        role="status"
        aria-live="polite"
      ></p>

    </form>
  </main>

  <!-- Tela ampliada de assinatura -->

  <div
    class="modal-assinatura"
    id="modalAssinatura"
    role="dialog"
    aria-modal="true"
    aria-label="Assinar em tela cheia"
  >

    <div class="assinatura-interface">

      <div class="modal-topo">
        <h2>Faça sua assinatura</h2>

        <p>
          Assine com o dedo seguindo o sentido da linha.
        </p>
      </div>

      <div class="area-desenho">
        <div class="quadro-assinatura">

          <div
            class="guia-assinatura"
            aria-hidden="true"
          >
            <div class="guia-texto">
              Assine seu nome sobre a linha
            </div>

            <div class="guia-linha"></div>

            <div class="guia-direcao">
              Início à esquerda → Final à direita
            </div>
          </div>

          <canvas id="canvasAssinatura"></canvas>

        </div>
      </div>

      <div class="modal-botoes">

        <button
          type="button"
          class="btn-cancelar"
          id="cancelarAssinatura"
        >
          Cancelar
        </button>

        <button
          type="button"
          class="btn-limpar"
          id="limparAssinatura"
        >
          Limpar
        </button>

        <button
          type="button"
          class="btn-confirmar"
          id="confirmarAssinatura"
        >
          Confirmar
        </button>

      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL =
      "https://brpjkexhqyrdbwcpauzx.supabase.co";

    const SUPABASE_PUBLIC_KEY =
      "sb_publishable_BLiXeI0liB-xSRI11-Gv-g_hZ2eIYSY";

    const URL_FUNCAO =
      SUPABASE_URL +
      "/functions/v1/registrar-presenca";

    const URL_NOME_TREINAMENTO =
      SUPABASE_URL +
      "/rest/v1/rpc/obter_nome_treinamento";

    const parametros = new URLSearchParams(
      window.location.search
    );

    const codigo = parametros.get("codigo");

    const formulario = document.getElementById(
      "formulario"
    );

    const enviar = document.getElementById(
      "enviar"
    );

    const mensagem = document.getElementById(
      "mensagem"
    );

    const nomeTreinamento = document.getElementById(
      "nomeTreinamento"
    );

    const modal = document.getElementById(
      "modalAssinatura"
    );

    const canvas = document.getElementById(
      "canvasAssinatura"
    );

    const contexto = canvas.getContext("2d");

    const imagemPreview = document.getElementById(
      "imagemPreview"
    );

    const textoPreview = document.getElementById(
      "textoPreview"
    );

    let desenhando = false;
    let temTracos = false;
    let assinaturaConfirmada = null;
    let assinaturaAnterior = null;
    let ultimoFoco = null;
    let treinamentoCarregado = false;
    let ponteiroAtivo = null;

    function mostrarMensagem(texto, sucesso = false) {
      mensagem.textContent = texto;

      mensagem.className = sucesso
        ? "sucesso"
        : "erro";
    }

    async function carregarTreinamento() {
      if (!codigo) {
        nomeTreinamento.textContent =
          "Treinamento não identificado";

        mostrarMensagem(
          "Link inválido: código do treinamento não informado."
        );

        return;
      }

      try {
        const resposta = await fetch(
          URL_NOME_TREINAMENTO,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "apikey": SUPABASE_PUBLIC_KEY
            },
            body: JSON.stringify({
              p_codigo: codigo
            })
          }
        );

        if (!resposta.ok) {
          throw new Error(
            "Não foi possível consultar o treinamento."
          );
        }

        const nome = await resposta.json();

        if (
          typeof nome !== "string" ||
          !nome.trim()
        ) {
          throw new Error(
            "Treinamento não encontrado. Verifique o link."
          );
        }

        nomeTreinamento.textContent = nome;
        treinamentoCarregado = true;
        enviar.disabled = false;

      } catch (erro) {
        nomeTreinamento.textContent =
          "Não foi possível carregar o treinamento";

        mostrarMensagem(
          erro.message ||
          "Erro ao carregar o treinamento."
        );

        enviar.disabled = true;
      }
    }

    function prepararPincel() {
      contexto.strokeStyle = "#14233a";
      contexto.lineWidth = 3;
      contexto.lineCap = "round";
      contexto.lineJoin = "round";
    }

    /*
      O canvas não recebe rotação no JavaScript.

      A rotação acontece somente na interface visual,
      via CSS. As coordenadas do desenho continuam
      corretas e a imagem exportada fica horizontal.
    */

    function ajustarCanvas() {
      const rect = canvas.getBoundingClientRect();

      /*
        getBoundingClientRect() retorna as dimensões
        após a rotação CSS.

        offsetWidth e offsetHeight representam as
        dimensões reais do canvas antes da rotação.
      */

      const largura = Math.max(
        1,
        Math.round(canvas.offsetWidth)
      );

      const altura = Math.max(
        1,
        Math.round(canvas.offsetHeight)
      );

      if (!largura || !altura) {
        return;
      }

      const larguraAntiga = canvas.width;
      const alturaAntiga = canvas.height;

      if (
        larguraAntiga === largura &&
        alturaAntiga === altura
      ) {
        return;
      }

      const imagemAntiga = document.createElement(
        "canvas"
      );

      if (
        larguraAntiga > 0 &&
        alturaAntiga > 0 &&
        temTracos
      ) {
        imagemAntiga.width = larguraAntiga;
        imagemAntiga.height = alturaAntiga;

        imagemAntiga
          .getContext("2d")
          .drawImage(canvas, 0, 0);
      }

      canvas.width = largura;
      canvas.height = altura;

      prepararPincel();

      if (temTracos && imagemAntiga.width) {
        const escala = Math.min(
          largura / larguraAntiga,
          altura / alturaAntiga
        );

        const larguraFinal =
          larguraAntiga * escala;

        const alturaFinal =
          alturaAntiga * escala;

        contexto.drawImage(
          imagemAntiga,
          (largura - larguraFinal) / 2,
          (altura - alturaFinal) / 2,
          larguraFinal,
          alturaFinal
        );
      }
    }

    function limparCanvas() {
      contexto.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      temTracos = false;
      desenhando = false;
      ponteiroAtivo = null;
    }

    function mostrarPreview() {
      if (assinaturaConfirmada) {
        imagemPreview.src = assinaturaConfirmada;
        imagemPreview.style.display = "block";
        textoPreview.style.display = "none";
      } else {
        imagemPreview.removeAttribute("src");
        imagemPreview.style.display = "none";
        textoPreview.style.display = "block";
      }
    }

    function desenharImagemProporcional(imagem) {
      const escala = Math.min(
        canvas.width / imagem.width,
        canvas.height / imagem.height
      );

      const larguraFinal =
        imagem.width * escala;

      const alturaFinal =
        imagem.height * escala;

      contexto.drawImage(
        imagem,
        (canvas.width - larguraFinal) / 2,
        (canvas.height - alturaFinal) / 2,
        larguraFinal,
        alturaFinal
      );
    }

    function abrirModal() {
      ultimoFoco = document.activeElement;
      assinaturaAnterior = assinaturaConfirmada;

      modal.classList.add("aberto");
      document.body.classList.add(
        "modal-aberto"
      );

      ajustarCanvas();
      limparCanvas();

      if (assinaturaConfirmada) {
        const imagem = new Image();

        imagem.onload = () => {
          if (
            !modal.classList.contains("aberto")
          ) {
            return;
          }

          desenharImagemProporcional(imagem);
          temTracos = true;
        };

        imagem.src = assinaturaConfirmada;
      }

      document.getElementById(
        "confirmarAssinatura"
      ).focus();
    }

    function fecharModal() {
      modal.classList.remove("aberto");

      document.body.classList.remove(
        "modal-aberto"
      );

      if (
        ultimoFoco &&
        ultimoFoco.focus
      ) {
        ultimoFoco.focus();
      }
    }

    /*
      Converte a posição do dedo para as coordenadas
      internas do canvas, inclusive quando a interface
      está girada em 90 graus.
    */

    function posicao(evento) {
      const rect = canvas.getBoundingClientRect();

      const girado = window.matchMedia(
        "(orientation: portrait) and (pointer: coarse)"
      ).matches;

      if (girado) {
        return {
          x:
            (evento.clientY - rect.top) *
            canvas.width / rect.height,

          y:
            (rect.right - evento.clientX) *
            canvas.height / rect.width
        };
      }

      return {
        x:
          (evento.clientX - rect.left) *
          canvas.width / rect.width,

        y:
          (evento.clientY - rect.top) *
          canvas.height / rect.height
      };
    }

    canvas.addEventListener(
      "pointerdown",
      (evento) => {
        if (
          evento.pointerType === "mouse" &&
          evento.button !== 0
        ) {
          return;
        }

        if (desenhando) {
          return;
        }

        evento.preventDefault();

        desenhando = true;
        temTracos = true;
        ponteiroAtivo = evento.pointerId;

        canvas.setPointerCapture(
          evento.pointerId
        );

        const p = posicao(evento);

        contexto.beginPath();
        contexto.moveTo(p.x, p.y);
        contexto.lineTo(p.x, p.y);
        contexto.stroke();
      }
    );

    canvas.addEventListener(
      "pointermove",
      (evento) => {
        if (
          !desenhando ||
          evento.pointerId !== ponteiroAtivo
        ) {
          return;
        }

        evento.preventDefault();

        const p = posicao(evento);

        contexto.lineTo(p.x, p.y);
        contexto.stroke();
      }
    );

    function pararDesenho(evento) {
      if (
        evento &&
        evento.pointerId !== ponteiroAtivo
      ) {
        return;
      }

      desenhando = false;
      ponteiroAtivo = null;
    }

    canvas.addEventListener(
      "pointerup",
      pararDesenho
    );

    canvas.addEventListener(
      "pointercancel",
      pararDesenho
    );

    canvas.addEventListener(
      "lostpointercapture",
      pararDesenho
    );

    /*
      Recorta somente os traços da assinatura.

      A linha de referência e os textos não entram
      na imagem porque são elementos HTML separados
      do canvas.
    */

    function gerarAssinaturaPadronizada() {
      const largura = canvas.width;
      const altura = canvas.height;

      const pixels = contexto.getImageData(
        0,
        0,
        largura,
        altura
      ).data;

      let esquerda = largura;
      let direita = -1;
      let topo = altura;
      let base = -1;

      for (let y = 0; y < altura; y++) {
        for (let x = 0; x < largura; x++) {
          const indice =
            (y * largura + x) * 4;

          if (pixels[indice + 3] > 10) {
            esquerda = Math.min(esquerda, x);
            direita = Math.max(direita, x);
            topo = Math.min(topo, y);
            base = Math.max(base, y);
          }
        }
      }

      if (direita < esquerda || base < topo) {
        throw new Error(
          "Não foi possível identificar a assinatura."
        );
      }

      const margem = 12;

      esquerda = Math.max(
        0,
        esquerda - margem
      );

      topo = Math.max(
        0,
        topo - margem
      );

      direita = Math.min(
        largura - 1,
        direita + margem
      );

      base = Math.min(
        altura - 1,
        base + margem
      );

      const larguraRecorte =
        direita - esquerda + 1;

      const alturaRecorte =
        base - topo + 1;

      const saida = document.createElement(
        "canvas"
      );

      saida.width = 800;
      saida.height = 300;

      const ctxSaida = saida.getContext(
        "2d"
      );

      const margemSaida = 18;

      const larguraDisponivel =
        saida.width - margemSaida * 2;

      const alturaDisponivel =
        saida.height - margemSaida * 2;

      const escala = Math.min(
        larguraDisponivel / larguraRecorte,
        alturaDisponivel / alturaRecorte
      );

      const larguraFinal =
        larguraRecorte * escala;

      const alturaFinal =
        alturaRecorte * escala;

      ctxSaida.imageSmoothingEnabled = true;
      ctxSaida.imageSmoothingQuality = "high";

      ctxSaida.drawImage(
        canvas,
        esquerda,
        topo,
        larguraRecorte,
        alturaRecorte,
        (saida.width - larguraFinal) / 2,
        (saida.height - alturaFinal) / 2,
        larguraFinal,
        alturaFinal
      );

      return saida.toDataURL("image/png");
    }

    document.getElementById(
      "abrirAssinatura"
    ).addEventListener(
      "click",
      abrirModal
    );

    document.getElementById(
      "limparAssinatura"
    ).addEventListener(
      "click",
      limparCanvas
    );

    document.getElementById(
      "cancelarAssinatura"
    ).addEventListener(
      "click",
      () => {
        assinaturaConfirmada =
          assinaturaAnterior;

        fecharModal();
        mostrarPreview();
      }
    );

    document.getElementById(
      "confirmarAssinatura"
    ).addEventListener(
      "click",
      () => {
        if (!temTracos) {
          alert(
            "Faça sua assinatura antes de confirmar."
          );

          return;
        }

        try {
          assinaturaConfirmada =
            gerarAssinaturaPadronizada();

          mostrarPreview();
          mostrarMensagem("");
          fecharModal();

        } catch (erro) {
          alert(
            erro.message ||
            "Não foi possível salvar a assinatura."
          );
        }
      }
    );

    /*
      Se o celular mudar de orientação enquanto
      o modal estiver aberto, redimensionamos
      o canvas preservando os traços existentes.
    */

    let ajustePendente = false;

    window.addEventListener(
      "resize",
      () => {
        if (
          !modal.classList.contains("aberto")
        ) {
          return;
        }

        if (ajustePendente) {
          return;
        }

        ajustePendente = true;

        requestAnimationFrame(() => {
          ajustePendente = false;

          if (!desenhando) {
            ajustarCanvas();
          }
        });
      }
    );

    formulario.addEventListener(
      "submit",
      async (evento) => {
        evento.preventDefault();

        if (!codigo || !treinamentoCarregado) {
          mostrarMensagem(
            "Treinamento não identificado. Verifique o link."
          );

          return;
        }

        if (!assinaturaConfirmada) {
          mostrarMensagem(
            "Clique em 'Assinar em tela cheia' e confirme sua assinatura."
          );

          return;
        }

        enviar.disabled = true;
        enviar.textContent = "Registrando...";

        mostrarMensagem("");

        const dados = {
          codigo_acesso: codigo,

          nome: document.getElementById(
            "nome"
          ).value.trim(),

          matricula: document.getElementById(
            "matricula"
          ).value.trim(),

          funcao: document.getElementById(
            "funcao"
          ).value.trim(),

          setor: document.getElementById(
            "setor"
          ).value.trim(),

          assinatura: assinaturaConfirmada
        };

        try {
          const resposta = await fetch(
            URL_FUNCAO,
            {
              method: "POST",
              headers: {
                "Content-Type":
                  "application/json"
              },
              body: JSON.stringify(dados)
            }
          );

          const resultado = await resposta.json();

          if (
            !resposta.ok ||
            !resultado.sucesso
          ) {
            throw new Error(
              resultado.erro ||
              resultado.mensagem ||
              "Não foi possível registrar a presença."
            );
          }

          mostrarMensagem(
            "Presença registrada com sucesso!",
            true
          );

          formulario.reset();

          assinaturaConfirmada = null;
          assinaturaAnterior = null;

          limparCanvas();
          mostrarPreview();

          enviar.textContent =
            "Presença registrada";

          enviar.disabled = true;

        } catch (erro) {
          mostrarMensagem(
            erro.message ||
            "Erro de conexão. Tente novamente."
          );

          enviar.disabled = false;

          enviar.textContent =
            "Registrar presença";
        }
      }
    );

    mostrarPreview();
    carregarTreinamento();
  </script>

</body>
</html>
