
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Lista de Presença - Via Bebidas</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: #f1f3f5;
      font-family: Arial, sans-serif;
      color: #222;
    }

    .container {
      max-width: 480px;
      margin: 20px auto;
      padding: 25px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 12px #00000015;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 5px;
    }

    .subtitulo {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 16px;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    canvas {
      width: 100%;
      height: 180px;
      border: 2px solid #ccc;
      border-radius: 6px;
      background: white;
      touch-action: none;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    .limpar {
      background: #e9ecef;
      color: #333;
    }

    .enviar {
      background: #087f5b;
      color: white;
      font-weight: bold;
    }

    .aviso {
      font-size: 13px;
      color: #666;
      margin-top: 15px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>VIA BEBIDAS</h1>
    <p class="subtitulo">
      Lista de Presença de Treinamento
    </p>

    <form id="formulario">
      <label for="nome">Nome completo</label>
      <input id="nome" required maxlength="150">

      <label for="matricula">Matrícula</label>
      <input id="matricula" required maxlength="30">

      <label for="funcao">Função</label>
      <input id="funcao" maxlength="100">

      <label for="setor">Setor</label>
      <input id="setor" required maxlength="100">

      <label>Assinatura</label>
      <canvas id="assinatura"></canvas>

      <button type="button"
              class="limpar"
              id="limpar">
        Limpar assinatura
      </button>

      <button type="submit" class="enviar">
        Registrar presença
      </button>
    </form>

    <p class="aviso" id="mensagem">
      Página em configuração.
      Nenhum dado será enviado nesta etapa.
    </p>
  </div>

  <script>
    
const parametros = new URLSearchParams(window.location.search);
const codigoTreinamento = parametros.get("codigo");

if (!codigoTreinamento) {
  document.getElementById("mensagem").textContent =
    "Link de treinamento inválido. Solicite um novo link ao responsável.";

  document.querySelector(".enviar").disabled = true;
}

    const canvas = document.getElementById("assinatura");
    const ctx = canvas.getContext("2d");

    let desenhando = false;
    let assinou = false;

    function ajustarCanvas() {
      const largura = canvas.clientWidth;
      const altura = canvas.clientHeight;

      canvas.width = largura;
      canvas.height = altura;

      ctx.lineWidth = 2.5;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = "#111";

      assinou = false;
    }

    ajustarCanvas();

    function posicao(evento) {
      const rect = canvas.getBoundingClientRect();

      return {
        x: evento.clientX - rect.left,
        y: evento.clientY - rect.top
      };
    }

    canvas.addEventListener("pointerdown", (evento) => {
      desenhando = true;
      canvas.setPointerCapture(evento.pointerId);

      const p = posicao(evento);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
    });

    canvas.addEventListener("pointermove", (evento) => {
      if (!desenhando) return;

      const p = posicao(evento);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      assinou = true;
    });

    function parar() {
      desenhando = false;
    }

    canvas.addEventListener("pointerup", parar);
    canvas.addEventListener("pointercancel", parar);

    document.getElementById("limpar")
      .addEventListener("click", () => {
        ajustarCanvas();
      });

    document.getElementById("formulario")
      .addEventListener("submit", async (evento) => {
        evento.preventDefault();

        const mensagem =
          document.getElementById("mensagem");

        if (!assinou) {
          mensagem.textContent =
            "Por favor, faça sua assinatura.";
          return;
        }


mensagem.textContent = "Verificando conexão com o servidor...";

try {
  const resposta = await fetch(
    "https://brpjkexhqyrdbwcpauzx.supabase.co/functions/v1/registrar-presenca",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({})
    }
  );

  const resultado = await resposta.json();

  mensagem.textContent =
    resultado.mensagem ||
    resultado.erro ||
    "Resposta recebida do servidor";

} catch (erro) {
  mensagem.textContent =
    "Não foi possível conectar ao servidor.";
}

      });
  </script>
</body>
</html>
